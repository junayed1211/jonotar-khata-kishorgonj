<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিপোর্ট জমা দিন - জনতার খাতা</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased py-10">
    <div class="max-w-xl mx-auto px-4">
        <div class="bg-white border border-slate-200 shadow-lg rounded-3xl p-8">
            <h1 class="text-2xl font-black text-slate-900 mb-2 text-center">আপনার রিপোর্ট জমা দিন</h1>
            <p class="text-xs text-slate-500 text-center mb-6">আপনার পরিচয় গোপন থাকবে। নির্দ্বিধায় অনিয়মের বিরুদ্ধে লিখুন।</p>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="bg-emerald-50 border border-emerald-300 text-emerald-700 px-4 py-3 rounded-xl mb-4 text-sm font-medium">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">সংশ্লিষ্ট দপ্তর বা সেবা:</label>
                    <select name="category" required class="w-full border border-slate-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:border-slate-900">
                        <option value="ভূমি অফিস">ভূমি অফিস</option>
                        <option value="হিসাবরক্ষণ অফিস">হিসাবরক্ষণ অফিস</option>
                        <option value="কর অফিস">কর অফিস</option>
                        <option value="কাস্টমস অফিস">কাস্টমস অফিস</option>
                        <option value="ট্রাফিক পুলিশ">ট্রাফিক পুলিশ</option>
                        <option value="বিআরটিএ">বিআরটিএ</option>
                        <option value="পাসপোর্ট অফিস">পাসপোর্ট অফিস</option>
                        <option value="পৌরসভা">পৌরসভা</option>
                        <option value="সাব-রেজিস্ট্রি অফিস">সাব-রেজিস্ট্রি অফিস</option>
                        <option value="শিক্ষা অফিস">শিক্ষা অফিস</option>
                        <option value="ইউনিয়ন পরিষদ">ইউনিয়ন পরিষদ</option>
                        <option value="সরকারি হাসপাতাল">সরকারি হাসপাতাল</option>
                        <option value="অন্যান্য সরকারি সেবা">অন্যান্য সরকারি সেবা</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">থানা / উপজেলা:</label>
                    <select name="thana" required class="w-full border border-slate-300 rounded-xl p-3 text-sm bg-white focus:outline-none focus:border-slate-900">
                        <option value="কিশোরগঞ্জ সদর">কিশোরগঞ্জ সদর</option>
                        <option value="হোসেনপুর">হোসেনপুর</option>
                        <option value="পাকুন্দিয়া">পাকুন্দিয়া</option>
                        <option value="কটিয়াদী">কটিয়াদী</option>
                        <option value="করিমগঞ্জ">করিমগঞ্জ</option>
                        <option value="তাড়াইল">তাড়াইল</option>
                        <option value="বাজিতপুর">বাজিতপুর</option>
                        <option value="কুলিয়ারচর">কুলিয়ারচর</option>
                        <option value="ভৈরব">ভৈরব</option>
                        <option value="নিকলী">নিকলী</option>
                        <option value="অষ্টগ্রাম">অষ্টগ্রাম</option>
                        <option value="ইটনা">ইটনা</option>
                        <option value="মিঠামইন">মিঠামইন</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">বিস্তারিত বিবরণ:</label>
                    <textarea name="content" rows="5" required class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-slate-900" placeholder="আপনার অভিযোগ বা অনিয়মের বিবরণ বিস্তারিত লিখুন..."></textarea>
                </div>

                <div class="flex justify-between items-center pt-2">
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition-all shadow-sm cursor-pointer">জমা দিন</button>
                    <a href="{{ url_for('index') }}" class="text-xs text-slate-500 hover:text-slate-900 font-medium">← হোমে ফিরে যান</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
