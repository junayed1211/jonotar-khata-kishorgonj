<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ঘুষ বা হয়রানির রিপোর্ট জমা দিন - জনতার খাতা</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f4f0; margin: 0; padding: 20px; color: #111; }
        .form-container { max-width: 650px; background: #fff; border: 1px solid #000; padding: 30px; margin: 30px auto; box-shadow: 4px 4px 0px #000; }
        h2 { margin-top: 0; font-size: 24px; border-bottom: 2px solid #ffd700; padding-bottom: 10px; }
        p.subtitle { color: #555; font-size: 14px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 15px; }
        select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
        select:focus, textarea:focus { border-color: #000; outline: none; }
        
        .btn-submit { background: #000; color: #fff; padding: 14px 28px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 4px; transition: 0.2s; width: 100%; }
        .btn-submit:hover { background: #333; }
        
        .privacy-warning { background: #fff8d6; border-left: 4px solid #ffd700; padding: 12px; font-size: 13px; color: #555; margin-bottom: 20px; }
        .back-link { display: inline-block; margin-top: 15px; color: #000; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2> অনিয়ম বা হয়রানির রিপোর্ট জমা দিন</h2>
        <p class="subtitle">আপনার পরিচয় সম্পূর্ণ গোপন থাকবে। নির্ভয়ে সত্য তথ্য লিখুন।</p>

        <div class="privacy-warning">
             <strong>গোপনীয়তার নিশ্চয়তা:</strong> এই ফর্মে কোনো নাম, মোবাইল নম্বর বা ইমেইল সংগ্রহ করা হয় না।
        </div>

        <form action="/submit" method="POST">
            
            <!-- 1. Thana Selection -->
            <div class="form-group">
                <label for="thana"> উপজেলা / থানা নির্বাচন করুন:</label>
                <select name="thana" id="thana" required>
                    <option value="" disabled selected>-- উপজেলা সিলেক্ট করুন --</option>
                    <option value="কিশোরগঞ্জ সদর">কিশোরগঞ্জ সদর</option>
                    <option value="হোসেনপুর">হোসেনপুর</option>
                    <option value="পাকুন্দিয়া">পাকুন্দিয়া</option>
                    <option value="কটিয়াদী">কটিয়াদী</option>
                    <option value="করিমগঞ্জ">করিমগঞ্জ</option>
                    <option value="তাড়াইল">তাড়াইল</option>
                    <option value="বাজিতপুর">বাজিতপুর</option>
                    <option value="কুলিয়ারচর">কুলিয়ারচর</option>
                    <option value="ভৈরব">ভৈরব</option>
                    <option value="নিকলী">নিকলী</option>
                    <option value="অষ্টগ্রাম">অষ্টগ্রাম</option>
                    <option value="ইটনা">ইটনা</option>
                    <option value="মিঠামইন">মিঠামইন</option>
                </select>
            </div>

            <!-- 2. Sector / Category Selection -->
            <div class="form-group">
                <label for="category">🏢 অনিয়মের দপ্তর / খাত নির্বাচন করুন:</label>
                <select name="category" id="category" required>
                    <option value="" disabled selected> দপ্তর সিলেক্ট করুন </option>
                    <option value="পাসপোর্ট অফিস">পাসপোর্ট অফিস</option>
                    <option value="হাসপাতাল / স্বাস্থ্য কেন্দ্র">হাসপাতাল / স্বাস্থ্য কেন্দ্র</option>
                    <option value="ভূমি অফিস / এসিল্যান্ড অফিস">ভূমি অফিস / এসিল্যান্ড অফিস</option>
                    <option value="পুলিশ / থানা সেবা">পুলিশ / থানা সেবা</option>
                    <option value="বিদ্যুৎ অফিস">বিদ্যুৎ অফিস</option>
                    <option value="উপজেলা পরিষদ / ইউনিয়ন পরিষদ">উপজেলা / ইউনিয়ন পরিষদ</option>
                    <option value="শিক্ষা প্রতিষ্ঠান">শিক্ষা প্রতিষ্ঠান</option>
                    <option value="বিআরটিএ / পরিবহন">বিআরটিএ / পরিবহন</option>
                    <option value="অন্যান্য">অন্যান্য </option>
                </select>
            </div>

            <!-- 3. Report Content -->
            <div class="form-group">
                <label for="content">✍️ আপনার অভিযোগের বিবরণ লিখুন:</label>
                <textarea name="content" id="content" rows="6" placeholder="কী ঘটেছিল, কত টাকা ঘুষ চাওয়া হয়েছে বা কীভাবে হয়রানি করা হয়েছে তার বিবরণ স্পষ্ট করে লিখুন..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">রিপোর্ট জমা দিন →</button>
        </form>

        <a href="/" class="back-link">← হোমপেজে ফিরে যান</a>
    </div>

</body>
</html>
